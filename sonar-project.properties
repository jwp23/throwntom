sonar.organization=jwp23
sonar.projectKey=jwp23_throwntom
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,macos/Throwntom/Tests/**
sonar.exclusions=docs/**
# Pass-through files (ADR-018): bare calls into an SDK a test process cannot reach or must not
# invoke, and no decision of their own. Out of coverage measurement here and, through
# `tools/swiftmutantshard -scope`, out of Swift mutation scope: one list, one reason per file.
# A file that grows a decision leaves this list and gets a test.
#   ThrowntomUI/SystemNotificationAuthorizer.swift — UNUserNotificationCenter authorization; refuses a process without an app bundle.
#   ThrowntomUI/SystemNotificationInspector.swift — UNUserNotificationCenter settings and delivered report; same refusal.
#   ThrowntomUI/SystemReminderPresenter.swift — UNUserNotificationCenter banner calls; same refusal.
#   ThrowntomClient/BundledMainAppService.swift — SMAppService.mainApp login item; registering changes the machine's login items.
#
# macos/generate-icon.sh, macos/mask-icon.swift and tools/unmatte-white-background.swift are
# standalone build tooling, run by hand to regenerate committed image artifacts (like
# macos/build.sh and macos/agent.sh); they are not part of any test target and carry no decision
# logic worth covering.
#
# tools/lsreg/system.go is the wrapper around the real lsregister binary and os.Exit; it has no
# decision logic of its own (that lives in main.go) and cannot run under a test without a live
# Launch Services database.
sonar.coverage.exclusions=macos/Throwntom/Sources/ThrowntomUI/SystemNotificationAuthorizer.swift,macos/Throwntom/Sources/ThrowntomUI/SystemNotificationInspector.swift,macos/Throwntom/Sources/ThrowntomUI/SystemReminderPresenter.swift,macos/Throwntom/Sources/ThrowntomClient/BundledMainAppService.swift,macos/generate-icon.sh,macos/mask-icon.swift,tools/lsreg/system.go,tools/unmatte-white-background.swift
sonar.go.coverage.reportPaths=coverage.out
sonar.swift.coverage.reportPaths=swift-coverage.txt
sonar.qualitygate.wait=true
# DaemonAPI in DaemonClient.swift holds the daemon's fixed HTTP routes (/v1/command, /v1/tasks, /v1/events,
# /v1/timer/*, /v1/stats). swift:S1075 reads each as a hardcoded URI that should be configurable; the
# only configurable part of the address is the socket path, which lives in DaemonPaths. Excluded for
# this one file so every new route does not need a false-positive mark.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.e1.resourceKey=macos/Throwntom/Sources/ThrowntomClient/DaemonClient.swift

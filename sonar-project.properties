sonar.organization=jwp23
sonar.projectKey=jwp23_throwntom
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,macos/Throwntom/Tests/**
sonar.exclusions=docs/**
# Pass-throughs to AppKit and UNUserNotificationCenter, which refuse to answer a process without
# an app bundle and so cannot run under a test. They are still analysed for issues; only coverage
# is excluded, and everything that decides anything lives behind their protocols instead.
sonar.coverage.exclusions=macos/Throwntom/Sources/ThrowntomUI/NotificationAdapters.swift,macos/Throwntom/Sources/ThrowntomUI/ThrowntomApp.swift
sonar.go.coverage.reportPaths=coverage.out
sonar.swift.coverage.reportPaths=swift-coverage.txt
sonar.qualitygate.wait=true

name: SonarQube

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  sonarqube:
    # Dependabot runs don't receive Actions secrets, so SONAR_TOKEN is empty and
    # the scan can't authenticate; skip — dependency bumps carry no analyzable code.
    if: github.actor != 'dependabot[bot]'
    # macOS, because the Swift analyzer needs a completed `swift build` before it can scan.
    # The runner is named rather than left to float: `macos-latest` rolled to macos-26 and this
    # job then compiled the same SwiftUI source into different private type names than ci.yml's
    # did, which failed PR #220 with nothing in the diff to explain it. `xcode-27` carries the
    # Xcode a developer here builds with as its default toolchain, so the two jobs agree without
    # a `DEVELOPER_DIR` override to keep in step. This line has to keep saying what ci.yml's
    # macOS job says; the reasoning and the fallback are written out there.
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Generate code coverage
        run: go test -timeout 30s -coverprofile=coverage.out ./...

      - name: Test Swift package
        run: swift test --package-path macos/Throwntom --enable-code-coverage --force-resolved-versions

      - name: Generate Swift coverage report
        run: |
          # `swift test` builds one .xctest bundle per test target rather than a single merged
          # "PackageTests" bundle, so llvm-cov needs each target's binary named explicitly —
          # `default.profdata` already carries the merged instrumentation for all of them.
          BIN_PATH="$(swift build --package-path macos/Throwntom --show-bin-path --force-resolved-versions)"
          xcrun llvm-cov show \
            "$BIN_PATH/ThrowntomClientTests.xctest/Contents/MacOS/ThrowntomClientTests" \
            -object "$BIN_PATH/ThrowntomUITests.xctest/Contents/MacOS/ThrowntomUITests" \
            -instr-profile "$BIN_PATH/codecov/default.profdata" \
            -ignore-filename-regex='\.build|Tests/' \
            > swift-coverage.txt

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # SonarCloud's free plan has no custom quality gate, so overall-code drift on
  # main isn't enforced by the gate. This job runs after the scan (which waits
  # for analysis via sonar.qualitygate.wait), queries the API, and fails while
  # opening/refreshing a tracking issue whenever main has any open issue or
  # unreviewed hotspot. PRs stay governed by the free new-code gate.
  audit:
    name: SonarCloud drift audit
    needs: sonarqube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit SonarCloud issues on main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/sonar-audit.sh --branch main

name: Swift mutation testing (weekly full-scope)

# ADR-015: swift-mutation-testing runs weekly over the whole in-scope package,
# not on PRs — every mutant pays a full XCTest run, so a target costs hours on
# a macOS runner. The Throwntom executable target (a 13-line entry point) is out
# of scope. A negative control gates every score, and survivors land in one
# labelled tracking issue that closes itself on a clean run; triage happens in
# beads, the same shape as the SonarCloud drift audit.

on:
  schedule:
    # Sunday 06:23 UTC.
    - cron: '23 6 * * 0'
  workflow_dispatch: {}
  push:
    branches: [feat/swift-mutation-weekly]

permissions: {}

# A dispatch overlapping the schedule would race the other run to file or
# close the tracking issue. Queue instead of cancelling: a cancelled run throws
# away hours of finished mutation work.
concurrency:
  group: swift-mutation-weekly
  cancel-in-progress: false

env:
  # ADR-015 pins a source build: the tool is young (3 stars) and publishes only
  # through an untrusted Homebrew tap. f271976 is the commit the 2026-09-12
  # spike measured.
  SWIFT_MUTATION_TESTING_COMMIT: f27197668228077b60666f0b6db4f9d52b438ddd
  # The tool needs swift-tools-version 6.2; the image's default Xcode (16.4)
  # ships Swift 6.1. /usr/bin/swift, which the tool invokes for every mutant,
  # honours DEVELOPER_DIR.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build-tool:
    name: Build swift-mutation-testing
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout swift-mutation-testing
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ericodx/swift-mutation-testing
          ref: ${{ env.SWIFT_MUTATION_TESTING_COMMIT }}
          persist-credentials: false

      - name: Build
        run: swift build -c release

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-mutation-testing
          path: .build/release/swift-mutation-testing
          if-no-files-found: error

  # Fails the whole run before any score exists if the tool would report a
  # known survivor as anything but Survived (see macos/mutation-control.sh).
  control:
    name: Negative control
    needs: build-tool
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The daemon tests build throwntomd with go.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Download swift-mutation-testing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-mutation-testing
          path: ${{ runner.temp }}/bin

      # Artifacts do not preserve the executable bit.
      - name: Run negative control
        run: |
          chmod +x "$RUNNER_TEMP/bin/swift-mutation-testing"
          macos/mutation-control.sh "$RUNNER_TEMP/bin/swift-mutation-testing"

  # One job per target: the tool has no shard flag, and each target fits well
  # inside the 6-hour job limit on its own (~1.3 h client, ~2.5 h UI estimated
  # from the spike).
  mutate:
    name: Mutate (${{ matrix.target }})
    needs: control
    runs-on: macos-15
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [ThrowntomClient, ThrowntomUI]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Download swift-mutation-testing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-mutation-testing
          path: ${{ runner.temp }}/bin

      # ADR-015 run parameters. The cache is deleted first because it replays
      # stale Killed verdicts after test edits and --no-cache still writes it
      # (upstream #67, #68). 120 s, because at the 30 s default a true survivor
      # was reported Crash (#69); one worker, because parallel workers only
      # queue on SwiftPM's build lock inside each mutant's timeout (#70).
      # script(1) gives the tool a pseudo-terminal: piped, its stdout is
      # block-buffered and a job killed at its timeout would log no progress
      # at all. script passes the tool's exit status through.
      - name: Run swift-mutation-testing
        working-directory: macos/Throwntom
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/swift-mutation-testing"
          rm -rf .swift-mutation-testing-cache
          script -q /dev/null "$RUNNER_TEMP/bin/swift-mutation-testing" . \
            --testing-framework xctest --timeout 120 --concurrency 1 \
            --sources-path "Sources/$TARGET" \
            --output "$RUNNER_TEMP/report-$TARGET.json"

      # The JSON report is the forensic record: only it carries killedBy.
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-mutation-report-${{ matrix.target }}
          path: ${{ runner.temp }}/report-${{ matrix.target }}.json
          if-no-files-found: error

  summary:
    name: Survivor tracking issue
    needs: [control, mutate]
    # A failed control means no score at all; a failed or timed-out target
    # means an incomplete one. Neither may close or rewrite the issue.
    if: always() && needs.control.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Require every target to have completed
        if: needs.mutate.result != 'success'
        env:
          MUTATE_RESULT: ${{ needs.mutate.result }}
        run: |
          echo "::error::A mutate job did not complete ($MUTATE_RESULT); the tracking issue is left untouched." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: swift-mutation-report-*
          path: ${{ runner.temp }}/reports
          merge-multiple: true

      # swiftmutantsgate exits 0 when clean, 1 when mutants need triage, 2 when
      # a report is missing or unreadable. Survivors are the data this run
      # exists to capture, so only 2 fails the step; the issue carries the rest.
      - name: Gate reports
        id: gate
        run: |
          set -uo pipefail
          code=0
          go run ./tools/swiftmutantsgate -equivalents .swift-mutation-equivalents.json \
            "$RUNNER_TEMP/reports/report-ThrowntomClient.json" \
            "$RUNNER_TEMP/reports/report-ThrowntomUI.json" > "$RUNNER_TEMP/gate.md" || code=$?
          cat "$RUNNER_TEMP/gate.md"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ]

      # Label, not title, marks the tracking issue. More than one open issue
      # with it fails loudly rather than guessing which to update.
      - name: File, refresh or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create swift-mutation-survivors --color b60205 \
            --description "Open weekly Swift mutation-testing survivor report" --force
          numbers="$(gh issue list --state open --label swift-mutation-survivors --json number --jq '.[].number')"
          count="$(printf '%s' "$numbers" | grep -c . || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::$count open swift-mutation-survivors issues ($numbers); reconcile by hand." >&2
            exit 1
          fi

          if [ "$GATE_CODE" = "0" ]; then
            if [ -n "$numbers" ]; then
              gh issue close "$numbers" --comment "Full-scope run found no unexcluded survivors. Closing. Run: $RUN_URL"
            fi
            exit 0
          fi

          {
            cat "$RUNNER_TEMP/gate.md"
            echo
            echo "Run: $RUN_URL (JSON reports, with killedBy, are attached as artifacts)."
            echo
            echo "Triage each into a killing test or a reviewed entry in \`.swift-mutation-equivalents.json\` (ADR-015). Tracking lives in beads; this issue is transient and closes itself on a clean run."
          } > "$RUNNER_TEMP/issue.md"

          if [ -n "$numbers" ]; then
            gh issue edit "$numbers" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Swift mutation testing: surviving mutants" \
              --label swift-mutation-survivors --body-file "$RUNNER_TEMP/issue.md"
          fi

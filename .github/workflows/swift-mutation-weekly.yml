name: Swift mutation testing (weekly full-scope)

# ADR-015: swift-mutation-testing runs weekly over the whole in-scope package,
# not on PRs — every mutant pays a full XCTest run, so a target costs hours on
# a macOS runner. The Throwntom executable target (a 13-line entry point) is out
# of scope. A negative control gates every score, and survivors land in one
# labelled tracking issue that closes itself on a clean run; triage happens in
# beads, the same shape as the SonarCloud drift audit.

on:
  schedule:
    # Sunday 06:23 UTC.
    - cron: '23 6 * * 0'
  workflow_dispatch: {}

permissions: {}

# A dispatch overlapping the schedule would race the other run to file or
# close the tracking issue. Queue instead of cancelling: a cancelled run throws
# away hours of finished mutation work.
concurrency:
  group: swift-mutation-weekly
  cancel-in-progress: false

env:
  # ADR-017 forks the tool to jwp23/swift-mutation-testing and this pins that
  # fork. ADR-015's reason for building from source still holds — the tool
  # publishes only through an untrusted Homebrew tap — and the fork publishes no
  # binary at all. 2b1ab48 is the fork's main tip, carrying the three
  # correctness fixes ADR-017 required before switching over (startup sandbox
  # sweep scoped to ownership, escaped-child cleanup scoped to the run's own
  # descendants, --no-cache that does not write), with a green CI run on that
  # exact commit. ADR-017 makes the two-run race test a required check on the
  # fork, so no commit on its main can have regressed the first two silently.
  SWIFT_MUTATION_TESTING_COMMIT: 2b1ab4823d38fb70912c98e24688e0a9cd6fbad7

jobs:
  build-tool:
    name: Build swift-mutation-testing
    # The image ci.yml's macOS job and sonarqube.yml both name, for the reasons
    # spelled out at ci.yml's `macos` job: the label names the Xcode a developer
    # here builds with as the image's own default, so no `DEVELOPER_DIR` override
    # has to be kept in step with it. This workflow carried such an override, for
    # Xcode 26.3 — and 26.3 is the Xcode that refused to compile
    # macos/Throwntom/Tests/ThrowntomClientTests/DeadlineTests.swift on a runner
    # (PR #221), a file the control and mutate jobs below both build. Xcode 27
    # ships Swift 6.4, well past the swift-tools-version 6.2 the tool's
    # Package.swift asks for.
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout swift-mutation-testing
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: jwp23/swift-mutation-testing
          ref: ${{ env.SWIFT_MUTATION_TESTING_COMMIT }}
          path: swift-mutation-testing
          persist-credentials: false

      # The tool asks for swift-syntax "from: 603.0.0", so without this every
      # build would float to whatever 603.x is newest. The fork's pinned commit
      # does track a Package.resolved of its own, byte-identical to this one, but
      # the copy stays: it keeps the swift-syntax revision this repo builds
      # against reviewable in this repo rather than inherited from a checkout,
      # and --force-resolved-versions refuses anything else.
      - name: Build
        working-directory: swift-mutation-testing
        run: |
          cp "$GITHUB_WORKSPACE/.github/swift-mutation-testing/Package.resolved" Package.resolved
          swift build -c release --force-resolved-versions

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-mutation-testing
          path: swift-mutation-testing/.build/release/swift-mutation-testing
          if-no-files-found: error

  # Fails the whole run before any score exists if the tool would report a
  # known survivor as anything but Survived (see macos/mutation-control.sh).
  control:
    name: Negative control
    needs: build-tool
    # Same image as build-tool, and for the stronger of its two reasons: this job
    # compiles throwntom's own Swift tests.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The daemon tests build throwntomd with go.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # These jobs run a third-party binary; saving a Go cache here could
          # seed one that ci.yml restores.
          cache: false

      - name: Download swift-mutation-testing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-mutation-testing
          path: ${{ runner.temp }}/bin

      # Artifacts do not preserve the executable bit.
      - name: Run negative control
        run: |
          chmod +x "$RUNNER_TEMP/bin/swift-mutation-testing"
          macos/mutation-control.sh "$RUNNER_TEMP/bin/swift-mutation-testing"

  # ADR-016: ThrowntomClient (337 mutants, 195 min measured) fits one job;
  # ThrowntomUI (1,200 mutants) is split into line-count-balanced file shards
  # by tools/swiftmutantshard. The UI shard count is repeated in the summary
  # job's report list, since a matrix cannot read workflow env.
  mutate:
    name: Mutate (${{ matrix.target }} ${{ matrix.index }}/${{ matrix.shards }})
    needs: control
    # Same image as build-tool and control: these jobs compile throwntom's own
    # Swift too, and the control that gates them speaks only for the toolchain it
    # ran on.
    runs-on: xcode-27
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ThrowntomClient, shards: 1, index: 1 }
          - { target: ThrowntomUI, shards: 8, index: 1 }
          - { target: ThrowntomUI, shards: 8, index: 2 }
          - { target: ThrowntomUI, shards: 8, index: 3 }
          - { target: ThrowntomUI, shards: 8, index: 4 }
          - { target: ThrowntomUI, shards: 8, index: 5 }
          - { target: ThrowntomUI, shards: 8, index: 6 }
          - { target: ThrowntomUI, shards: 8, index: 7 }
          - { target: ThrowntomUI, shards: 8, index: 8 }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # These jobs run a third-party binary; saving a Go cache here could
          # seed one that ci.yml restores.
          cache: false

      - name: Download swift-mutation-testing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-mutation-testing
          path: ${{ runner.temp }}/bin

      # ADR-015 run parameters. 240 s: a mutant that breaks SocketConnection's
      # locking makes the suite fail honestly but slowly — 117 s of it on a
      # developer machine before throwntom-aqna shortened the daemon-backed
      # tests' connect/request timeouts to leave real headroom rather than a
      # 3 s margin. 240 s keeps that headroom comfortable even on a slower CI
      # runner, and below 30 s a true survivor was reported Crash (#69). A
      # verdict that depends on the runner's mood is worse than a slow one,
      # and only a mutant that does time out pays the difference.
      # One worker, because parallel workers only queue on SwiftPM's build lock
      # inside each mutant's timeout (#70).
      # script(1) gives the tool a pseudo-terminal: piped, its stdout is
      # block-buffered and a job killed at its timeout would log no progress
      # at all. script passes the tool's exit status through.
      # The excludes go to a file first: reading them through a process
      # substitution would hide a failing swiftmutantshard behind an empty
      # list, which would silently mutate the whole target in every shard.
      - name: Run swift-mutation-testing
        working-directory: macos/Throwntom
        env:
          TARGET: ${{ matrix.target }}
          SHARDS: ${{ matrix.shards }}
          INDEX: ${{ matrix.index }}
        run: |
          chmod +x "$RUNNER_TEMP/bin/swift-mutation-testing"
          (cd ../.. && go run ./tools/swiftmutantshard -sources "macos/Throwntom/Sources/$TARGET" \
            -shards "$SHARDS" -index "$INDEX") > "$RUNNER_TEMP/excludes.txt"
          exclude_args=()
          while IFS= read -r pattern; do
            exclude_args+=(--exclude "$pattern")
          done < "$RUNNER_TEMP/excludes.txt"
          echo "Shard $INDEX/$SHARDS of $TARGET excludes ${#exclude_args[@]} argument(s)."
          script -q /dev/null "$RUNNER_TEMP/bin/swift-mutation-testing" . \
            --testing-framework xctest --timeout 240 --concurrency 1 \
            --sources-path "Sources/$TARGET" "${exclude_args[@]}" \
            --output "$RUNNER_TEMP/report-$TARGET-$INDEX.json"

      # The JSON report is the forensic record: only it carries killedBy.
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-mutation-report-${{ matrix.target }}-${{ matrix.index }}
          path: ${{ runner.temp }}/report-${{ matrix.target }}-${{ matrix.index }}.json
          if-no-files-found: error

  summary:
    name: Survivor tracking issue
    needs: [control, mutate]
    # A failed control means no score at all; a failed or timed-out target
    # means an incomplete one. Neither may close or rewrite the issue.
    if: always() && needs.control.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Require every target to have completed
        if: needs.mutate.result != 'success'
        env:
          MUTATE_RESULT: ${{ needs.mutate.result }}
        run: |
          echo "::error::A mutate job did not complete ($MUTATE_RESULT); the tracking issue is left untouched." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # These jobs run a third-party binary; saving a Go cache here could
          # seed one that ci.yml restores.
          cache: false

      - name: Download reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: swift-mutation-report-*
          path: ${{ runner.temp }}/reports
          merge-multiple: true

      # swiftmutantsgate exits 0 when clean, 1 when mutants need triage, 2 when
      # a report is missing or unreadable. Survivors are the data this run
      # exists to capture, so only 2 fails the step; the issue carries the rest.
      - name: Gate reports
        id: gate
        run: |
          set -uo pipefail
          # Named explicitly, not globbed, so a shard whose report is missing
          # is an error rather than a smaller clean score. 8 matches the
          # ThrowntomUI shard count in the mutate matrix.
          reports=("$RUNNER_TEMP/reports/report-ThrowntomClient-1.json")
          for index in 1 2 3 4 5 6 7 8; do
            reports+=("$RUNNER_TEMP/reports/report-ThrowntomUI-$index.json")
          done
          code=0
          go build -o "$RUNNER_TEMP/swiftmutantsgate" ./tools/swiftmutantsgate
          "$RUNNER_TEMP/swiftmutantsgate" -equivalents .swift-mutation-equivalents.json \
            -summary "$RUNNER_TEMP/summary.md" \
            "${reports[@]}" > "$RUNNER_TEMP/gate.md" || code=$?
          cat "$RUNNER_TEMP/gate.md"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ]

      # The full per-mutant list lives here rather than in the issue: GitHub caps
      # an issue body at 65,536 characters, which 630 mutants overran (112,339).
      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-mutation-gate
          path: |
            ${{ runner.temp }}/gate.md
            ${{ runner.temp }}/summary.md
          if-no-files-found: ignore

      # Label, not title, marks the tracking issue. More than one open issue
      # with it fails loudly rather than guessing which to update.
      - name: File, refresh or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create swift-mutation-survivors --color b60205 \
            --description "Open weekly Swift mutation-testing survivor report" --force
          numbers="$(gh issue list --state open --label swift-mutation-survivors --json number --jq '.[].number')"
          count="$(printf '%s' "$numbers" | grep -c . || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::$count open swift-mutation-survivors issues ($numbers); reconcile by hand." >&2
            exit 1
          fi

          if [ "$GATE_CODE" = "0" ]; then
            if [ -n "$numbers" ]; then
              gh issue close "$numbers" --comment "Full-scope run found no unexcluded survivors. Closing. Run: $RUN_URL"
            fi
            exit 0
          fi

          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Run: $RUN_URL. The full per-mutant list is the swift-mutation-gate artifact; the JSON reports, with killedBy, are attached too."
            echo
            echo "Triage each into a killing test or a reviewed entry in \`.swift-mutation-equivalents.json\` (ADR-015). Tracking lives in beads; this issue is transient and closes itself on a clean run."
          } > "$RUNNER_TEMP/issue.md"

          if [ -n "$numbers" ]; then
            gh issue edit "$numbers" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Swift mutation testing: surviving mutants" \
              --label swift-mutation-survivors --body-file "$RUNNER_TEMP/issue.md"
          fi

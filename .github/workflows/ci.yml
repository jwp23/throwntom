name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout=3m

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -timeout 30s ./...

      - name: Integration tests
        run: go test -timeout 30s -tags=integration ./integration

      - name: E2E tests
        run: go test -timeout 30s -tags=e2e ./e2e

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # ADR-014: whole-module mutation testing on every PR, no diff scoping or
  # scheduled sweep. Scope and the timeout coefficient live in .gremlins.yaml;
  # gremlinsgate enforces the zero-unexcluded-survivors bar gremlins' own
  # percentage thresholds can't express, against .gremlins-equivalents.json's
  # reviewed allowlist.
  gremlins:
    name: Mutation testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # Pinned to v0.6.0's commit, not the tag: a tag can be moved, a commit
      # hash can't (SonarCloud githubactions:S8545 — a tag alone isn't a
      # verified version for supply-chain purposes).
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@e05b1d47b8c55748e50abc28ff6b132c536bacca # v0.6.0

      - name: Build gremlinsgate
        run: go build -o /tmp/gremlinsgate ./tools/gremlinsgate

      - name: Run gremlins
        run: gremlins unleash -o gremlins-report.json .

      - name: Enforce zero unexcluded survivors
        run: /tmp/gremlinsgate -report gremlins-report.json -equivalents .gremlins-equivalents.json

      - name: Upload gremlins report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gremlins-report
          path: gremlins-report.json

  macos:
    name: macOS app
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The releases macos/swift-lint.sh pins, verified by checksum, ahead of whatever the
      # image happens to ship so an image update cannot change the style gate.
      - name: Install SwiftFormat 0.62.1 and SwiftLint 0.65.1
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat.zip
          curl -fsSL --proto '=https' --tlsv1.2 -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          shasum -a 256 -c - <<'SUMS'
          7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a  swiftformat.zip
          c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip
          SUMS
          mkdir -p "$HOME/.local/bin"
          unzip -q -o swiftformat.zip swiftformat -d "$HOME/.local/bin"
          unzip -q -o swiftlint.zip swiftlint -d "$HOME/.local/bin"
          rm swiftformat.zip swiftlint.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Swift style (Airbnb SwiftFormat + SwiftLint)
        run: macos/swift-lint.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build app bundle
        run: macos/build.sh

      - name: Swift tests
        working-directory: macos/Throwntom
        run: |
          xcodebuild test -scheme Throwntom -destination 'platform=macOS' 2>&1 | tee /tmp/swift-test.log | tail -50
          test "${PIPESTATUS[0]}" -eq 0

      # tail -50 above keeps a normal run's log readable; a failure can lose the actual
      # assertion in 497 tests of output, so the full run is kept here regardless of outcome.
      - name: Upload Swift test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-test-log
          path: /tmp/swift-test.log

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout=3m

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -timeout 30s ./...

      - name: Integration tests
        run: go test -timeout 30s -tags=integration ./integration

      - name: E2E tests
        run: go test -timeout 30s -tags=e2e ./e2e

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  macos:
    name: macOS app
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The releases macos/swift-lint.sh pins, verified by checksum, ahead of whatever the
      # image happens to ship so an image update cannot change the style gate.
      - name: Install SwiftFormat 0.62.1 and SwiftLint 0.65.1
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat.zip
          curl -fsSL --proto '=https' --tlsv1.2 -o swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          shasum -a 256 -c - <<'SUMS'
          7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a  swiftformat.zip
          c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip
          SUMS
          mkdir -p "$HOME/.local/bin"
          unzip -q -o swiftformat.zip swiftformat -d "$HOME/.local/bin"
          unzip -q -o swiftlint.zip swiftlint -d "$HOME/.local/bin"
          rm swiftformat.zip swiftlint.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Swift style (Airbnb SwiftFormat + SwiftLint)
        run: macos/swift-lint.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build app bundle
        run: macos/build.sh

      - name: Swift tests
        working-directory: macos/Throwntom
        run: xcodebuild test -scheme Throwntom -destination 'platform=macOS' | tail -50; test "${PIPESTATUS[0]}" -eq 0
